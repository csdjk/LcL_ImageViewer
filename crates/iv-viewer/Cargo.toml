[package]
name = "iv-viewer"
description = "ImageView 主程序：egui UI + wgpu GPU 渲染"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "imageview"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
iv-core = { path = "../iv-core" }
eframe = { version = "0.27", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "persistence",
] }
crossbeam-channel = "0.5"
rfd = "0.13"
bytemuck = { version = "1", features = ["derive"] }
# 仅用于启动时解码窗口图标 PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# HKCU 文件关联注册（设置面板"打开方式"集成）
winreg = "0.52"
# Native, recycle-only deletion. Versions already present in the dependency cache.
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.58"
