[package]
name = "iv-shell"
description = "Windows 资源管理器缩略图扩展（IThumbnailProvider COM）：DDS/TGA/PSD/QOI/HDR/Netpbm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "iv_shell"
crate-type = ["cdylib"]

[dependencies]
iv-core = { path = "../iv-core" }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
